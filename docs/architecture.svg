<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Route Scout Google Cloud architecture</title>
  <desc id="desc">A browser sends an opportunity to Cloud Run. FastAPI invokes a Google ADK agent powered by Gemini 3.5 Flash. Agent tools read public proof and deterministic scoring rules, then persist decisions in Firestore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102c4b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55e6d0"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#eef6ff}.label{font-size:18px;fill:#9db0c8}.title{font-size:42px;font-weight:800}.box-title{font-size:24px;font-weight:800}.tag{font-size:16px;font-weight:700;fill:#55e6d0}.box{fill:#10233a;stroke:#2a4c70;stroke-width:2}.flow{fill:none;stroke:#55e6d0;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="32" fill="url(#bg)"/>
  <text x="70" y="82" class="title">Route Scout architecture</text>
  <text x="70" y="120" class="label">Evidence-backed opportunity routing on Google Cloud</text>

  <g filter="url(#shadow)">
    <rect class="box" x="70" y="235" width="260" height="190" rx="22"/>
    <text x="100" y="278" class="tag">INPUT</text>
    <text x="100" y="320" class="box-title">Web client</text>
    <text x="100" y="355" class="label">Requirements</text>
    <text x="100" y="385" class="label">Prize and deadline</text>

    <rect class="box" x="430" y="180" width="330" height="300" rx="22"/>
    <text x="465" y="225" class="tag">GOOGLE CLOUD RUN</text>
    <text x="465" y="270" class="box-title">FastAPI service</text>
    <text x="465" y="310" class="label">POST /api/agent</text>
    <text x="465" y="342" class="label">POST /api/score</text>
    <text x="465" y="390" class="box-title">Google ADK runner</text>
    <text x="465" y="425" class="label">Bounded tool execution</text>

    <rect class="box" x="880" y="140" width="390" height="170" rx="22"/>
    <text x="915" y="185" class="tag">VERTEX AI</text>
    <text x="915" y="230" class="box-title">Gemini 3.5 Flash</text>
    <text x="915" y="268" class="label">Extract, explain, recommend</text>

    <rect class="box" x="880" y="365" width="390" height="205" rx="22"/>
    <text x="915" y="410" class="tag">AGENT TOOLS</text>
    <text x="915" y="454" class="box-title">Profile + scorer</text>
    <text x="915" y="490" class="label">Public proof inventory</text>
    <text x="915" y="522" class="label">Deterministic route policy</text>

    <rect class="box" x="510" y="630" width="500" height="125" rx="22"/>
    <text x="545" y="674" class="tag">FIRESTORE</text>
    <text x="545" y="716" class="box-title">Auditable decision ledger</text>
  </g>

  <path class="flow" d="M330 330H415"/>
  <path class="flow" d="M760 270C820 270 820 225 865 225"/>
  <path class="flow" d="M760 395H865"/>
  <path class="flow" d="M675 480V615"/>
  <path class="flow" d="M1075 365V325"/>
</svg>
